<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Menu Reorder Recommendation</title>
    <meta
      name="description"
      content="Drag and drop a fast food menu board layout, then copy the current menu recommendation to the clipboard."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Coiny&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="site-heading no-print">
        <h1>
          <span>Rearrange the items</span>
          <span>and share your dream menu</span>
        </h1>
        <div class="top-controls">
          <div class="layout-toggle" role="group" aria-label="Choose menu layout">
            <button
              class="segmented-button"
              type="button"
              id="verticalLayoutButton"
              aria-label="Vertical layout"
              title="Vertical layout"
              aria-pressed="true"
            >
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <rect x="6" y="3" width="12" height="4" rx="1.4"></rect>
                <rect x="6" y="10" width="12" height="4" rx="1.4"></rect>
                <rect x="6" y="17" width="12" height="4" rx="1.4"></rect>
              </svg>
            </button>
            <button
              class="segmented-button"
              type="button"
              id="horizontalLayoutButton"
              aria-label="Horizontal layout"
              title="Horizontal layout"
              aria-pressed="false"
            >
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <rect x="3" y="6" width="4" height="12" rx="1.4"></rect>
                <rect x="10" y="6" width="4" height="12" rx="1.4"></rect>
                <rect x="17" y="6" width="4" height="12" rx="1.4"></rect>
              </svg>
            </button>
          </div>
          <aside class="submission no-print" aria-label="Copy or reset menu recommendation">
            <button class="secondary-button action-button" type="button" id="resetButton">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M4 12a8 8 0 1 0 2.35-5.65"></path>
                <path d="M4 4v6h6"></path>
              </svg>
              <span>Reset</span>
            </button>
            <button class="primary-button action-button" type="button" id="copyMenuButton">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <rect x="9" y="9" width="10" height="10" rx="2"></rect>
                <path d="M5 15V7a2 2 0 0 1 2-2h8"></path>
              </svg>
              <span id="copyButtonLabel">Copy</span>
            </button>
          </aside>
        </div>
      </header>

      <section class="workspace" aria-label="Menu board editor">
        <section class="board-wrap" aria-label="Fast food menu board">
          <div class="board" id="mainBoard" aria-label="Main menu panels"></div>
          <aside class="specials-shell" aria-label="Specials board">
            <div class="specials-board" id="specialsBoard"></div>
          </aside>
        </section>
      </section>

    </main>

    <template id="panelTemplate">
      <article class="panel" draggable="false">
        <div class="panel-meta no-print">
          <button class="panel-handle" type="button" draggable="true" aria-label="Drag panel">
          </button>
          <span class="panel-title"></span>
          <span class="panel-counter"></span>
        </div>
        <div class="panel-slots"></div>
      </article>
    </template>

    <template id="stripTemplate">
      <div class="strip" draggable="true">
        <div class="strip-text"></div>
        <div class="price"></div>
        <div class="strip-meta no-print"></div>
      </div>
    </template>

    <div hidden>
      <input id="importInput" type="file" accept="application/json,.json" />
      <button type="button" id="printButton"></button>
      <div id="statusMessage" role="status" aria-live="polite"></div>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
